spring.datasource.primary.jndi-name=java:jboss/SigeredDS
spring.datasource.secondary.jndi-name=java:/jboss/SigeredRhDS

spring.jpa.primary.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.secondary.database-platform=org.hibernate.dialect.SybaseASE15Dialect
spring.datasource.initialize=false

spring.jpa.show-sql=false
spring.jpa.properties.org.hibernate.envers.audit_table_suffix=_SERVICES
spring.jpa.properties.hibernate.integration.envers.enabled=true
origin.allow= *
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=2MB
